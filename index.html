    --line:#233140;
    --green:#8fffb0;
    --green-dim:#4f8f66;
    --yellow:#ffd83d;
    --red:#ff6b6b;
    --text:#d7e6df;
    --text-dim:#7f96a0;
    --radius:0px;
  }
  #pxroot[data-theme="light"]{
    --bg:#eef3ee;
    --panel:#ffffff;
    --panel-2:#e2ece2;
    --line:#b7c9bd;
    --green:#1f8f4d;
    --green-dim:#1f8f4d;
    --yellow:#a86f00;
    --red:#c23b3b;
    --text:#14201a;
    --text-dim:#4c5f55;

  *{box-sizing:border-box;}
  body{margin:0;}
  #pxroot{
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    font-size:14px;
    line-height:1.5;
  }
  #pxroot::before{
    content:"";
    position:fixed; inset:0;
    background:repeating-linear-gradient(

    z-index:50;

  const CANCEL_DELAY_HOURS = 24; // cancelamento pedido pelo vendedor só sai do ar depois desse prazo
  function runListingLifecycle(){
    const now = Date.now();
    const changed = [];
    state.listings.forEach(l=>{
      let didChange = false;
      if((l.status === 'Disponível' || l.status === 'Reservado') && l.expiresAt && l.expiresAt < now){
        l.status = 'Expirado';
        didChange = true;
      }
      if(l.status === 'Encerrado' && l.closedAt && (now - l.closedAt) > AUTO_FINALIZE_DAYS * 86400000){
        l.status = 'Concluído';
        l.autoFinalized = true;
        didChange = true;
      }
      if(l.status === 'Cancelando' && l.cancelRequestedAt && (now - l.cancelRequestedAt) > CANCEL_DELAY_HOURS * 3600000){
        l.status = '__deleted__';
        didChange = true;
      }
      if(didChange) changed.push(l);
    });
    return changed;
  }

  // ---- Gerador de Pix "copia e cola" (BR Code / EMV QR Code do Banco Central) ----
  function crc16ccitt(str){
    let crc = 0xFFFF;
    for(let i=0;i<str.length;i++){
      crc ^= (str.charCodeAt(i) << 8);
      for(let j=0;j<8;j++){
        crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
      }
    }
    return crc.toString(16).toUpperCase().padStart(4,'0');
  }
  function emvField(id, value){
    return id + String(value.length).padStart(2,'0') + value;

  // amount é opcional — sem ele, o Pix fica "aberto" e quem for pagar digita o valor que quiser.
  function buildPixPayload(amount, txid){
    const merchantAccountInfo = emvField('26', emvField('00','BR.GOV.BCB.PIX') + emvField('01', PIX_KEY));
    let payload =
      emvField('00','01') +
      emvField('01','11') +
      merchantAccountInfo +
      emvField('52','0000') +
      emvField('53','986') +
      (amount ? emvField('54', Number(amount).toFixed(2)) : '') +
      emvField('58','BR') +
      emvField('59', PIX_MERCHANT_NAME.substring(0,25)) +
      emvField('60', PIX_MERCHANT_CITY.substring(0,15)) +
      emvField('62', emvField('05', (txid || '***').substring(0,25))) +
      '6304';
    return payload + crc16ccitt(payload);
  }

  async function loadState(){
    if(!sb){ console.error('Supabase não carregou — verifique a tag <script> do supabase-js.'); state.loaded = true; return; }
    try{
      const { data: profileRows, error: e1 } = await sb.from('profiles').select('*');
      if(e1) throw e1;
      state.users = {};
      (profileRows || []).forEach(row => { state.users[row.username] = profileRowToUser(row); });
    }catch(e){ console.error('Falha ao carregar perfis:', e); state.users = {}; }

    try{
      const { data: listingRows, error: e2 } = await sb.from('listings').select('*');
      if(e2) throw e2;
      const { data: commentRows, error: e3 } = await sb.from('listing_comments').select('*').order('created_at', { ascending:true });
      if(e3) throw e3;
      const commentsByListing = {};
      (commentRows || []).forEach(c=>{
        if(!commentsByListing[c.listing_id]) commentsByListing[c.listing_id] = [];
        commentsByListing[c.listing_id].push({ id:c.id, user:c.username, text:c.text, offer: c.offer!=null?Number(c.offer):null, ts: tsToMs(c.created_at) });
      });
      state.listings = (listingRows || []).map(row => listingRowToListing(row, commentsByListing[row.id]));
    }catch(e){ console.error('Falha ao carregar anúncios:', e); state.listings = []; }

    try{
      const { data: upRows, error: e4 } = await sb.from('upgrade_requests').select('*');
      if(e4) throw e4;
      state.upgradeRequests = (upRows || []).map(upgradeRowToRequest);
    }catch(e){ console.error('Falha ao carregar solicitações de apoio:', e); state.upgradeRequests = []; }

    // Sessão de login já existente (persistida pelo próprio Supabase Auth no navegador)
    try{
      const { data: sessionData } = await sb.auth.getSession();
      if(sessionData && sessionData.session){
        const uid = sessionData.session.user.id;
        const found = Object.values(state.users).find(u => u.id === uid);
        if(found) state.currentUser = found.username;
      }
    }catch(e){ /* sem sessão ativa, segue como visitante */ }

    state.loaded = true;
  }

      const { error } = await sb.from('profiles').upsert(rows, { onConflict:'id' });
      if(error) throw error;
      return true;
    }catch(e){ console.error('Falha ao salvar perfis:', e); return false; }
  }

      comment.ts = tsToMs(data.created_at);

    }catch(e){ console.error('Falha ao salvar mensagem:', e); return false; }
  }
  async function deleteComment(commentId){
    if(!sb) return false;
    try{
      const { error } = await sb.from('listing_comments').delete().eq('id', commentId);
      if(error) throw error;
      return true;
    }catch(e){ console.error('Falha ao remover mensagem:', e); return false; }

  function el(tag, attrs, children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k.startsWith('on')){ e.addEventListener(k.slice(2), attrs[k]); }
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c => { if(c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }

  let clockInterval = null;
  function startLiveClock(){
    if(clockInterval) clearInterval(clockInterval);
    function tick(){
      const el2 = document.getElementById('liveClock');
      if(!el2){ clearInterval(clockInterval); clockInterval = null; return; }
      el2.textContent = new Date().toLocaleTimeString('pt-BR', { hour12:false });
    }
    tick();
    clockInterval = setInterval(tick, 1000);
  }

  // ---------- MERCADO ----------
  function filteredListings(){
    let list = state.listings.filter(l => l.status === 'Disponível' || l.status === 'Reservado');
    const q = state.filter.q.trim().toLowerCase();
    if(q) list = list.filter(l => l.pokemon.toLowerCase().includes(q));
    if(state.filter.shinyOnly) list = list.filter(l => l.shiny);
    if(state.filter.sort === 'recent') list = list.slice().sort((a,b)=> b.createdAt - a.createdAt);
    if(state.filter.sort === 'price_asc') list = list.slice().sort((a,b)=> a.price - b.price);
    if(state.filter.sort === 'price_desc') list = list.slice().sort((a,b)=> b.price - a.price);
    return list;
  }

  function renderMercado(container){
    container.appendChild(el('h2',{class:'section-title'},['Mercado']));

    [['recent','Mais recentes'],['price_asc','Menor preço'],['price_desc','Maior preço']].forEach(([v,l])=>{

    });

  function renderGridOnly(){
    const wrap = document.getElementById('grid-wrap');
    if(!wrap) return;

      wrap.appendChild(el('div',{class:'empty'},['Nenhum anúncio encontrado. Ajuste os filtros ou seja o primeiro a anunciar.']));
      return;
    }
    const grid = el('div',{class:'grid'});

  function listingCard(l){
    const card = el('div',{class:'card pixel-border'});
    const identity = el('div',{style:'display:flex; align-items:center; gap:10px;'});
    if(l.sprite){
      identity.appendChild(el('img',{class:'poke-sprite', src:l.sprite, width:'36', height:'36', alt:l.pokemon, loading:'lazy'}));
    }
    identity.appendChild(el('div',{},[
      el('div',{class:'name'},[l.pokemon]),
      l.shiny ? el('div',{class:'shiny'},['✦ SHINY']) : null,
    ]));
    const row1 = el('div',{class:'row1'},[
      identity,
      el('span',{class:'badge r-' + l.rarity.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')},[l.rarity]),
    ]);
    card.appendChild(row1);
    card.appendChild(el('div',{class:'meta'},[
      el('span',{},['Nv. ' + l.level]),
      el('span',{},[ivLabel(l)]),
      accountPlanOf(l.seller) === 'pro' ? el('span',{class:'badge pro-badge'},['★ APOIADOR']) : null,
      l.imageUrl ? el('span',{class:'badge'},['📎 print']) : null,
      l.status !== 'Disponível' ? el('span',{class:'badge status-' + l.status.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')},[l.status]) : null,
    ]));
    card.appendChild(el('div',{class:'price'},['R$ ' + Number(l.price).toFixed(2)]));
    card.appendChild(el('div',{class:'seller'},['Vendedor: ', el('b',{},[l.seller])]));
    const sellerPb = renderPokeballs(sellerRatingAvg(l.seller), sellerRatingCount(l.seller));
    if(sellerPb) card.appendChild(sellerPb);
    card.appendChild(el('div',{class:'actions'},[
      buildHeartButton(l),
      el('button',{class:'btn ghost', onclick: ()=>{ state.openListingId = l.id; render(); }},['Ver anúncio']),
    ]));
    return card;
  }

  function renderAnunciar(container){
    container.appendChild(el('h2',{class:'section-title'},['Publicar anúncio']));

    if(!state.currentUser){
      container.appendChild(el('div',{class:'panel pixel-border'},[
        el('p',{},['Você precisa de uma conta de treinador para publicar um anúncio.']),
        el('button',{class:'btn', onclick:()=>setView('conta')},['Criar conta / Entrar']),
      ]));
      return;
    }

    const plan = accountPlanOf(state.currentUser);
    const activeCount = activeListingCount(state.currentUser);
    if(plan !== 'pro' && activeCount >= FREE_LISTING_LIMIT){
      container.appendChild(renderUpgradeGate(activeCount));
      return;
    }

    const panel = el('div',{class:'panel wide pixel-border'});
    if(plan !== 'pro'){
      panel.appendChild(el('div',{class:'note'},[
        'Plano Grátis: ' + activeCount + '/' + FREE_LISTING_LIMIT + ' anúncios ativos usados.'
      ]));
    }
    const msgSlot = el('div',{id:'anunciar-msg'});
    panel.appendChild(msgSlot);

    const fRarity = el('div',{class:'field'},[
      el('label',{},['Raridade']),
    ]);
    const raritySel = el('select',{});
    RARITIES.forEach(r => raritySel.appendChild(el('option',{value:r},[r])));
    fRarity.appendChild(raritySel);
    fRarity.appendChild(el('div',{class:'note'},['Sugerida automaticamente para lendários/míticos oficiais — ajuste se o jogo mostrar outra raridade.']));

    const picker = buildPokedexPicker({ onSelect: (p)=>{ if(p && p.rarity){ raritySel.value = p.rarity; } } });
    const fLevel = fieldInput('Nível', 'number', '1-100');
    const fQuality = fieldInput('Qualidade', 'text', 'ex: 1.71');
    const fIvText = fieldInput('IV', 'number', 'ex: 133');
    fIvText.querySelector('input').setAttribute('min','0');
    fIvText.querySelector('input').setAttribute('max', String(IV_MAX));
    fIvText.appendChild(el('div',{class:'note'},['Máximo fixo /' + IV_MAX + ' — digite só o valor atual do Pokémon.']));
    const fPrice = fieldInput('Preço de referência (R$)', 'number', 'ex: 25.00');
    const fContact = fieldInput('Contato (Discord / WhatsApp)', 'text', 'ex: discord: usuario#0000');
    const fNotes = fieldTextarea('Observações', 'Nature, moveset, contexto da conta, etc.');

    const fShiny = el('div',{class:'field'},[
      el('label',{},['Shiny']),
      el('div',{class:'check-row'},[ (()=>{ const c = el('input',{type:'checkbox', id:'shinyChk'}); return c; })(), el('label',{for:'shinyChk'},['Esta criatura é shiny']) ]),
    ]);
    const shinyChk = fShiny.querySelector('input');

    const row = el('div',{class:'field-row'},[fLevel, fQuality, fIvText]);
    const row2 = el('div',{class:'field-row'},[fPrice, fRarity]);

    const fImage = el('div',{class:'field'},[
      el('label',{},['Print do Pokémon no jogo (opcional)']),
      el('input',{type:'file', accept:'image/*'}),
      el('div',{class:'note'},['Anexe um print da tela do jogo pra comprovar nível, IV, qualidade etc.']),
    ]);

    panel.appendChild(picker.container);
    panel.appendChild(row);
    panel.appendChild(row2);
    panel.appendChild(fShiny);
    panel.appendChild(fContact);
    panel.appendChild(fNotes);
    panel.appendChild(fImage);

    const submitBtn = el('button',{class:'btn'},['Publicar anúncio']);
    submitBtn.addEventListener('click', async ()=>{
      msgSlot.innerHTML = '';
      const sel = picker.getSelected();
      const levelV = Number(fLevel.querySelector('input').value);
      const qualityV = fQuality.querySelector('input').value.trim();
      const ivRaw = fIvText.querySelector('input').value.trim();
      const ivTextV = ivRaw ? (ivRaw + '/' + IV_MAX) : '';
      const priceV = Number(fPrice.querySelector('input').value);
      const contactV = fContact.querySelector('input').value.trim();
      const notesV = fNotes.querySelector('textarea').value.trim();

      if(!sel){
        msgSlot.appendChild(el('div',{class:'msg err'},['Escolha o Pokémon na lista da Poképedia antes de publicar.']));
        return;
      }
      if(!levelV || !priceV || !contactV){
        msgSlot.appendChild(el('div',{class:'msg err'},['Preencha ao menos nível, preço e contato.']));
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = 'Publicando...';
      const nowTs = Date.now();
      const sellerIdV = (state.users[state.currentUser] && state.users[state.currentUser].id);

      let imageUrl = null;
      const imageFile = fImage.querySelector('input[type="file"]').files[0];
      if(imageFile && sb){
        const fileErr = validateImageFile(imageFile);
        if(fileErr){
          msgSlot.appendChild(el('div',{class:'msg err'},[fileErr]));
          submitBtn.disabled = false;
          submitBtn.textContent = 'Publicar anúncio';
          return;
        }
        submitBtn.textContent = 'Enviando print...';
        const path = sellerIdV + '/' + newId() + '-' + sanitizeFileName(imageFile.name);
        const { error: upErr } = await sb.storage.from('listing-images').upload(path, imageFile);
        if(upErr){
          msgSlot.appendChild(el('div',{class:'msg err'},['Não foi possível enviar o print (o anúncio não foi publicado): ' + upErr.message]));
          submitBtn.disabled = false;
          submitBtn.textContent = 'Publicar anúncio';
          return;
        }
        const { data: pub } = sb.storage.from('listing-images').getPublicUrl(path);
        imageUrl = pub.publicUrl;
        submitBtn.textContent = 'Publicando...';
      }

      const listing = {
        id: newId(),
        sellerId: sellerIdV,
        seller: state.currentUser,
        pokemon: sel.name,
        pokedexId: sel.id,
        sprite: sel.sprite,
        imageUrl: imageUrl,
        level: levelV,
        ivText: ivTextV || null,
        quality: qualityV || null,
        shiny: shinyChk.checked,
        rarity: raritySel.value,
        price: priceV,
        contact: contactV,
        notes: notesV,
        status: 'Disponível',
        createdAt: nowTs,
        expiresAt: nowTs + LISTING_DURATION_DAYS * 86400000,
        buyer: null,
        closedAt: null,
        rating: null,
        autoFinalized: false,
        comments: [],
        hearts: [],
      };
      state.listings.push(listing);
      const ok = await saveListings(listing);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Publicar anúncio';
      if(!ok){
        state.listings.pop();
        msgSlot.appendChild(el('div',{class:'msg err'},['Não foi possível salvar o anúncio agora. Tente novamente em instantes.']));
        return;
      }
      msgSlot.appendChild(el('div',{class:'msg ok'},['Anúncio publicado! Já está visível no mercado.']));
      picker.reset();
      [fLevel,fQuality,fIvText,fPrice,fContact].forEach(f=>{ const i=f.querySelector('input'); if(i) i.value=''; });
      fImage.querySelector('input[type="file"]').value = '';
      fNotes.querySelector('textarea').value = '';
      shinyChk.checked = false;
      raritySel.value = RARITIES[0];
    });
    panel.appendChild(submitBtn);
    container.appendChild(panel);
  }

  function buildPokedexPicker(opts){
    const onSelect = (opts && opts.onSelect) || function(){};
    const wrap = el('div',{class:'field poke-field'});
    wrap.appendChild(el('label',{},['Pokémon (Poképedia · PokePixel)']));
    const searchBox = el('input',{type:'text', placeholder: state.pokedexError ? 'Digite o nome do Pokémon' : 'Digite para buscar... ex: char, bulba, pika'});
    const resultsBox = el('div',{class:'poke-results'});
    const preview = el('div',{class:'poke-preview'});
    let selected = null;

    function renderPreview(){
      preview.innerHTML = '';
      if(!selected){ preview.style.display = 'none'; return; }
      preview.style.display = 'flex';
      if(selected.sprite){
        preview.appendChild(el('img',{class:'poke-sprite', src:selected.sprite, width:'36', height:'36', alt:selected.name}));
      }
      preview.appendChild(el('span',{},[ (selected.id ? '#' + String(selected.id).padStart(3,'0') + ' ' : '') + selected.name ]));
      const swapBtn = el('button',{type:'button', class:'btn ghost', style:'padding:4px 8px; font-size:10px;'},['trocar']);
      swapBtn.addEventListener('click', ()=>{ selected = null; searchBox.value=''; renderPreview(); searchBox.focus(); });
      preview.appendChild(swapBtn);
    }

    function renderResults(query){
      resultsBox.innerHTML = '';
      if(state.pokedexError){
        resultsBox.style.display = 'none';
        return;
      }
      if(!state.pokedex || state.pokedex.length === 0){
        resultsBox.appendChild(el('div',{class:'note', style:'padding:8px 10px;'},['Carregando lista da Poképedia...']));
        resultsBox.style.display = 'block';
        return;
      }
      const q = query.trim().toLowerCase();
      const matches = q ? state.pokedex.filter(p => p.name.toLowerCase().includes(q)) : state.pokedex;
      if(matches.length === 0){
        resultsBox.appendChild(el('div',{class:'note', style:'padding:8px 10px;'},['Nenhum Pokémon encontrado.']));
      } else {
        matches.forEach(p=>{
          const item = el('div',{class:'poke-item'});
          item.appendChild(el('img',{class:'poke-sprite', src:p.sprite, width:'26', height:'26', alt:p.name, loading:'lazy'}));
          item.appendChild(el('span',{},['#' + String(p.id).padStart(3,'0') + ' ' + p.name]));
          item.addEventListener('mousedown', (e)=>{ e.preventDefault(); selected = p; renderPreview(); resultsBox.style.display = 'none'; searchBox.value = ''; onSelect(p); });
          resultsBox.appendChild(item);
        });
      }
      resultsBox.style.display = 'block';
    }

    searchBox.addEventListener('focus', ()=> renderResults(searchBox.value));
    searchBox.addEventListener('input', ()=> renderResults(searchBox.value));
    searchBox.addEventListener('blur', ()=> setTimeout(()=>{ resultsBox.style.display = 'none'; }, 120));
    searchBox.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        if(state.pokedexError && searchBox.value.trim()){
          selected = { id:null, name: searchBox.value.trim(), sprite: null };
          renderPreview();
          resultsBox.style.display = 'none';
        }
      }
    });

    wrap.appendChild(searchBox);
    wrap.appendChild(resultsBox);
    wrap.appendChild(preview);
    if(state.pokedexError){
      wrap.appendChild(el('div',{class:'note'},['A lista da Poképedia não pôde ser carregada agora — digite o nome e pressione Enter.']));
    }
    renderPreview();

    return {
      container: wrap,
      getSelected: ()=> selected,
      reset: ()=>{ selected = null; searchBox.value = ''; renderPreview(); },
    };
  }

  function renderConta(container){
    if(!state.currentUser){
      container.appendChild(el('h2',{class:'section-title'},['Conta de treinador']));
      const panel = el('div',{class:'panel pixel-border'});
      const tabs = el('div',{class:'tabs2'});

      const regTab = el('button',{class: state.authTab==='register'?'active':'', onclick:()=>{ state.authTab='register'; render(); }},['Criar conta']);

      panel.appendChild(tabs);

      const msgSlot = el('div',{id:'auth-msg'});
      panel.appendChild(msgSlot);

      const fEmail = fieldInput('E-mail', 'email', 'seu@email.com');
      const fUser = fieldInput('Usuário (nome público)', 'text', 'nome de treinador');
      const fPass = fieldInput('Senha', 'password', 'mínimo 6 caracteres');
      panel.appendChild(fEmail);
      if(state.authTab === 'register') panel.appendChild(fUser);
      panel.appendChild(fPass);
      panel.appendChild(el('div',{class:'note'},['Login de verdade via Supabase Auth — sua senha nunca é vista nem guardada por este site.']));

      const actionBtn = el('button',{class:'btn'},[ state.authTab==='login' ? 'Entrar' : 'Criar conta' ]);
      actionBtn.addEventListener('click', async ()=>{
        const email = fEmail.querySelector('input').value.trim();
        const p = fPass.querySelector('input').value;
        msgSlot.innerHTML = '';
        if(!sb){
          msgSlot.appendChild(el('div',{class:'msg err'},['Conexão com o banco de dados indisponível agora.']));
          return;
        }
        if(!email || !p){
          msgSlot.appendChild(el('div',{class:'msg err'},['Informe e-mail e senha.']));
          return;
        }
        actionBtn.disabled = true;
        if(state.authTab === 'register'){
          const username = fUser.querySelector('input').value.trim();
          if(!username){
            msgSlot.appendChild(el('div',{class:'msg err'},['Escolha um nome de usuário.']));
            actionBtn.disabled = false;
            return;
          }
          if(state.users[username]){
            msgSlot.appendChild(el('div',{class:'msg err'},['Este nome de usuário já está em uso.']));
            actionBtn.disabled = false;
            return;
          }
          const { data, error } = await sb.auth.signUp({ email, password: p });
          if(error){
            msgSlot.appendChild(el('div',{class:'msg err'},[error.message]));
            actionBtn.disabled = false;
            return;
          }
          if(!data.session){
            msgSlot.appendChild(el('div',{class:'msg ok'},['Conta criada! Confira seu e-mail e clique no link de confirmação — depois volte aqui e faça login (vamos te pedir o nome de usuário nesse momento).']));
            actionBtn.disabled = false;
            return;
          }
          const uid = data.user.id;
          const { error: profErr } = await sb.from('profiles').insert({ id: uid, username, account_plan:'gratis' });
          if(profErr){
            msgSlot.appendChild(el('div',{class:'msg err'},['Conta criada, mas houve um erro ao salvar o perfil: ' + profErr.message]));
            actionBtn.disabled = false;
            return;
          }
          state.users[username] = { id: uid, username, accountPlan:'gratis', banned:false, isAdmin:false, ratingSum:0, ratingCount:0, createdAt: Date.now() };
          state.currentUser = username;
          setView('conta');
        } else {
          const { data, error } = await sb.auth.signInWithPassword({ email, password: p });
          if(error){
            msgSlot.appendChild(el('div',{class:'msg err'},['E-mail ou senha inválidos.']));
            actionBtn.disabled = false;
            return;
          }
          const uid = data.user.id;
          let found = Object.values(state.users).find(u => u.id === uid);
          if(!found){
            const { data: profRow } = await sb.from('profiles').select('*').eq('id', uid).single();
            if(profRow){ found = profileRowToUser(profRow); state.users[profRow.username] = found; }
          }
          if(!found){
            // Primeiro login depois de confirmar e-mail (cadastro não chegou a criar o perfil): concluir agora.
            msgSlot.innerHTML = '';
            msgSlot.appendChild(el('div',{style:'margin-bottom:8px;'},['Falta só um passo — escolha seu nome de usuário:']));
            const fFinishUser = fieldInput('Usuário', 'text', 'nome de treinador');
            msgSlot.appendChild(fFinishUser);
            const finishMsg = el('div',{});
            msgSlot.appendChild(finishMsg);
            const finishBtn = el('button',{class:'btn', style:'margin-top:8px;'},['Concluir cadastro']);
            finishBtn.addEventListener('click', async ()=>{
              const username = fFinishUser.querySelector('input').value.trim();
              finishMsg.innerHTML = '';
              if(!username){
                finishMsg.appendChild(el('div',{class:'msg err'},['Escolha um nome de usuário.']));
                return;
              }
              if(state.users[username]){
                finishMsg.appendChild(el('div',{class:'msg err'},['Este nome de usuário já está em uso.']));
                return;
              }
              const { error: profErr } = await sb.from('profiles').insert({ id: uid, username, account_plan:'gratis' });
              if(profErr){
                finishMsg.appendChild(el('div',{class:'msg err'},['Erro ao salvar o perfil: ' + profErr.message]));
                return;
              }
              state.users[username] = { id: uid, username, accountPlan:'gratis', banned:false, isAdmin:false, ratingSum:0, ratingCount:0, createdAt: Date.now() };
              state.currentUser = username;
              setView('conta');
            });
            msgSlot.appendChild(finishBtn);
            actionBtn.disabled = false;
            return;
          }
          if(found.banned){
            msgSlot.appendChild(el('div',{class:'msg err'},['Esta conta foi suspensa. Fale com a administração se achar que foi engano.']));
            await sb.auth.signOut();
            actionBtn.disabled = false;
            return;
          }
          state.currentUser = found.username;
          setView('conta');

        if(l.status === 'Concluído'){
          infoLines.push(el('div',{class:'note'},[ l.rating ? ('Avaliado por ' + l.buyer) : 'Concluído automaticamente (sem avaliação)' ]));
          if(l.rating) infoLines.push(renderPokeballs(l.rating.stars, null));
        }
        if(l.status === 'Expirado'){
          infoLines.push(el('div',{class:'note'},['Anúncio expirado sem negociação.']));
        }
        if(l.status === 'Cancelando'){
          infoLines.push(el('div',{class:'note'},['Saindo do ar em ' + new Date(l.cancelRequestedAt + CANCEL_DELAY_HOURS*3600000).toLocaleString('pt-BR') + '.']));
        }
        row.appendChild(el('div',{},infoLines));

        const actions = el('div',{style:'display:flex; gap:8px; align-items:center; flex-wrap:wrap;'});

        if(l.status === 'Disponível' || l.status === 'Reservado'){
          const statusSel = el('select',{});
          STATUSES.forEach(s => { const o = el('option',{value:s},[s]); if(l.status===s) o.selected=true; statusSel.appendChild(o); });
          statusSel.addEventListener('change', async e=>{ l.status = e.target.value; await saveListings(l); render(); });
          actions.appendChild(statusSel);

          const closeBtn = el('button',{class:'btn ghost'},['Encerrar (venda feita)']);
          closeBtn.addEventListener('click', ()=>{ state.openListingId = l.id; render(); });
          actions.appendChild(closeBtn);

          const editBtn = el('button',{class:'btn ghost'},['Editar']);
          editBtn.addEventListener('click', ()=>{ state.editListingId = l.id; setView('editar'); });
          actions.appendChild(editBtn);

          const cancelBtn = el('button',{class:'btn danger'},['Cancelar anúncio']);
          cancelBtn.addEventListener('click', async ()=>{
            l.statusBeforeCancel = l.status;
            l.status = 'Cancelando';
            l.cancelRequestedAt = Date.now();
            await saveListings(l);
            render();
          });
          actions.appendChild(cancelBtn);
        }

        if(l.status === 'Cancelando'){
          const undoBtn = el('button',{class:'btn ghost'},['Desistir do cancelamento']);
          undoBtn.addEventListener('click', async ()=>{
            l.status = l.statusBeforeCancel || 'Disponível';
            l.cancelRequestedAt = null;
            await saveListings(l);
            render();
          });
          actions.appendChild(undoBtn);
        }

        if(l.status === 'Expirado'){
          const repBtn = el('button',{class:'btn'},['Republicar']);
          repBtn.addEventListener('click', async ()=>{
            const clone = cloneForRepublish(l);
            state.listings.push(clone);
            await saveListings(clone);
            render();
          });
          actions.appendChild(repBtn);

          const delBtn = el('button',{class:'btn danger'},['Remover']);
          delBtn.addEventListener('click', async ()=>{
            l.status = '__deleted__';
            await saveListings(l);
            render();
          });
          actions.appendChild(delBtn);
        }

        const viewBtn = el('button',{class:'btn ghost'},['Ver']);
        viewBtn.addEventListener('click', ()=>{ state.openListingId = l.id; render(); });
        actions.appendChild(viewBtn);

        row.appendChild(actions);
        panel.appendChild(row);
      });
    }
    container.appendChild(panel);

    if(isAdmin(state.currentUser)){
      container.appendChild(renderAdminUpgradePanel());
    }
  }

  function renderAdminUpgradePanel(){
    const wrap = el('div',{style:'margin-top:24px;'});
    wrap.appendChild(el('h2',{class:'section-title'},['Painel admin · Solicitações de upgrade']));
    const panel = el('div',{class:'panel wide pixel-border'});
    const pending = state.upgradeRequests.filter(r => r.status === 'pendente').sort((a,b)=>a.requestedAt-b.requestedAt);
    if(pending.length === 0){
      panel.appendChild(el('div',{class:'empty'},['Nenhuma solicitação pendente.']));
    } else {
      pending.forEach(r=>{
        const row = el('div',{class:'my-listing-row'});
        row.appendChild(el('div',{},[
          el('div',{},[ el('b',{},[r.username]), ' — solicitado em ' + new Date(r.requestedAt).toLocaleString('pt-BR') ]),
          el('div',{},[ 'Valor declarado: ', el('b',{style:'color:var(--green); font-size:14px;'},['R$ ' + Number(r.amount).toFixed(2).replace('.',',')]) ]),
          r.note ? el('div',{class:'note'},['Nota: ' + r.note]) : null,
        ]));
        const approveBtn = el('button',{class:'btn'},['Aprovar → PRO']);
        approveBtn.addEventListener('click', async ()=>{
          r.status = 'aprovado';
          r.resolvedAt = Date.now();
          if(!state.users[r.username] && sb){
            const { data: profRow } = await sb.from('profiles').select('*').eq('username', r.username).single();
            if(profRow) state.users[r.username] = profileRowToUser(profRow);
          }
          const rec = state.users[r.username];
          if(!rec){
            alert('Não foi possível encontrar o perfil de ' + r.username + '.');
            return;
          }
          rec.accountPlan = 'pro';
          const ok1 = await saveUsers(r.username);
          const ok2 = await saveUpgradeRequests();
          if(!ok1 || !ok2){
            r.status = 'pendente';
            delete r.resolvedAt;
            return;
          }
          render();
        });
        const rejectBtn = el('button',{class:'btn danger'},['Rejeitar']);
        rejectBtn.addEventListener('click', async ()=>{
          r.status = 'rejeitado';
          r.resolvedAt = Date.now();
          await saveUpgradeRequests();
          render();
        });
        row.appendChild(el('div',{style:'display:flex; gap:8px;'},[approveBtn, rejectBtn]));
        panel.appendChild(row);
      });
    }
    wrap.appendChild(panel);

    wrap.appendChild(el('h2',{class:'section-title', style:'margin-top:24px;'},['Painel admin · Usuários']));
    const usersPanel = el('div',{class:'panel wide pixel-border'});
    const allUsers = Object.keys(state.users).sort();
    if(allUsers.length === 0){
      usersPanel.appendChild(el('div',{class:'empty'},['Nenhum usuário cadastrado.']));
    } else {
      allUsers.forEach(u=>{
        const rec = state.users[u];
        const row = el('div',{class:'my-listing-row'});
        row.appendChild(el('div',{},[
          el('div',{},[ el('b',{},[u]), rec.banned ? el('span',{class:'badge', style:'color:var(--red); margin-left:8px;'},['BANIDO']) : null ]),
          el('div',{class:'note'},[ accountPlanOf(u) === 'pro' ? 'PRO — ilimitado' : 'Grátis' ]),
        ]));
        const actionsRow = el('div',{style:'display:flex; gap:8px; flex-wrap:wrap;'});

        const proBtn = el('button',{class:'btn ghost'},[ accountPlanOf(u) === 'pro' ? 'Remover PRO' : 'Tornar PRO' ]);
        proBtn.addEventListener('click', async ()=>{
          rec.accountPlan = (accountPlanOf(u) === 'pro') ? 'gratis' : 'pro';
          await saveUsers(u);
          render();
        });
        actionsRow.appendChild(proBtn);

        const banBtn = el('button',{class: rec.banned ? 'btn ghost' : 'btn danger'},[ rec.banned ? 'Desbanir' : 'Banir' ]);
        banBtn.addEventListener('click', async ()=>{
          rec.banned = !rec.banned;
          await saveUsers(u);
          render();
        });
        actionsRow.appendChild(banBtn);

        row.appendChild(actionsRow);
        usersPanel.appendChild(row);
      });
    }
    wrap.appendChild(usersPanel);

    wrap.appendChild(el('h2',{class:'section-title', style:'margin-top:24px;'},['Painel admin · Moderação de anúncios']));
    const modPanel = el('div',{class:'panel wide pixel-border'});
    const modSearch = el('input',{type:'text', placeholder:'Buscar por Pokémon ou vendedor...', style:'margin-bottom:14px; width:100%;'});
    modPanel.appendChild(modSearch);
    const modListWrap = el('div',{});
    modPanel.appendChild(modListWrap);

    function renderModList(){
      modListWrap.innerHTML = '';
      const q = modSearch.value.trim().toLowerCase();
      const all = state.listings.filter(l => l.status !== '__deleted__' &&
        (!q || l.pokemon.toLowerCase().includes(q) || l.seller.toLowerCase().includes(q))
      ).sort((a,b)=>b.createdAt-a.createdAt).slice(0,30);
      if(all.length === 0){
        modListWrap.appendChild(el('div',{class:'empty'},['Nenhum anúncio encontrado.']));
        return;
      }
      all.forEach(l=>{
        const row = el('div',{class:'my-listing-row'});
        row.appendChild(el('div',{},[
          el('div',{},[ el('b',{},[l.pokemon]), ' — ', l.seller, ' · R$ ' + Number(l.price).toFixed(2) ]),
          el('div',{class:'note'},[l.status + ' · ' + l.comments.length + ' mensagem(ns)']),
        ]));
        const viewBtn = el('button',{class:'btn ghost'},['Ver']);
        viewBtn.addEventListener('click', ()=>{ state.openListingId = l.id; render(); });
        const removeBtn = el('button',{class:'btn danger'},['Remover (moderação)']);
        removeBtn.addEventListener('click', async ()=>{
          l.status = '__deleted__';
          await saveListings(l);
          render();
        });
        row.appendChild(el('div',{style:'display:flex; gap:8px;'},[viewBtn, removeBtn]));
        modListWrap.appendChild(row);
      });
    }
    modSearch.addEventListener('input', renderModList);
    renderModList();
    wrap.appendChild(modPanel);

    return wrap;
  }

  // ---------- MODAL DE ANÚNCIO ----------
  function renderModal(){
    if(!state.openListingId) return;
    const l = state.listings.find(x => x.id === state.openListingId);
    if(!l) { state.openListingId = null; return; }

    const bg = el('div',{class:'modal-bg', onclick: (e)=>{ if(e.target === bg){ state.openListingId = null; render(); } }});
    const modal = el('div',{class:'modal pixel-border'});
    const closeBtn = el('button',{class:'btn ghost close'},['Fechar']);
    closeBtn.addEventListener('click', ()=>{ state.openListingId = null; render(); });
    modal.appendChild(closeBtn);

    const titleRow = el('div',{style:'display:flex; align-items:center; gap:12px; clear:both; padding-top:10px;'});
    if(l.sprite){ titleRow.appendChild(el('img',{class:'poke-sprite', src:l.sprite, width:'48', height:'48', alt:l.pokemon})); }
    titleRow.appendChild(el('h2',{class:'px-font', style:'font-size:14px; margin:0;'},[l.pokemon + (l.shiny ? ' ✦' : '')]));
    modal.appendChild(titleRow);
    modal.appendChild(el('div',{class:'meta', style:'margin-bottom:10px;'},[
      el('span',{class:'badge'},['Nv. ' + l.level]),
      el('span',{class:'badge'},[ivLabel(l)]),
      el('span',{class:'badge r-' + l.rarity.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')},[l.rarity]),
      el('span',{class:'badge'},[l.status]),
    ]));
    const priceRow = el('div',{style:'display:flex; align-items:center; gap:14px;'},[
      el('div',{class:'price'},['R$ ' + Number(l.price).toFixed(2)]),
      buildHeartButton(l),
    ]);
    modal.appendChild(priceRow);
    const sellerRow = el('div',{class:'seller', style:'margin:8px 0; display:flex; align-items:center; gap:10px; flex-wrap:wrap;'},[
      el('span',{},['Vendedor: ', el('b',{},[l.seller]), ' · Contato: ', l.contact]),
    ]);
    const sellerPbModal = renderPokeballs(sellerRatingAvg(l.seller), sellerRatingCount(l.seller));
    if(sellerPbModal) sellerRow.appendChild(sellerPbModal);
    modal.appendChild(sellerRow);
    if(l.notes) modal.appendChild(el('p',{style:'color:var(--text-dim); font-size:12px;'},[l.notes]));
    if(l.imageUrl){
      const imgLink = el('a',{href:l.imageUrl, target:'_blank', rel:'noopener noreferrer', style:'display:block; margin:10px 0;'},[
        el('img',{src:l.imageUrl, style:'max-width:100%; max-height:280px; border:2px solid var(--line); display:block;', alt:'Print do Pokémon no jogo'}),
      ]);
      modal.appendChild(imgLink);
      modal.appendChild(el('div',{class:'note', style:'margin-bottom:10px;'},['📎 Print enviado pelo vendedor — clique pra ampliar.']));
    }

    // ---- Gestão da negociação (encerrar / cancelar / confirmar / resumo) ----
    const isSeller = state.currentUser === l.seller;
    const isBuyer = state.currentUser && l.buyer && state.currentUser.toLowerCase() === l.buyer.toLowerCase();

    if(isSeller && (l.status === 'Disponível' || l.status === 'Reservado')){
      const box = el('div',{class:'fee-box'});
      box.appendChild(el('div',{style:'margin-bottom:8px;'},['Encerrar negociação — quem foi o comprador?']));
      box.appendChild(el('div',{class:'note', style:'margin-bottom:8px;'},['A vaga do seu limite de anúncios só libera depois que o comprador confirmar o recebimento (ou após ' + AUTO_FINALIZE_DAYS + ' dias, se ele não confirmar).']));
      const buyerNames = Array.from(new Set(l.comments.map(c=>c.user).filter(u=>u !== l.seller)));
      let buyerInput;
      if(buyerNames.length > 0){
        buyerInput = el('select',{});
        buyerInput.appendChild(el('option',{value:''},['Selecione quem comentou...']));
        buyerNames.forEach(u => buyerInput.appendChild(el('option',{value:u},[u])));
      } else {
        buyerInput = el('input',{type:'text', placeholder:'Usuário do comprador'});
      }
      box.appendChild(buyerInput);
      const otherInput = el('input',{type:'text', placeholder:'ou digite o usuário aqui', style:'margin-top:8px;'});
      box.appendChild(otherInput);
      const closeMsg = el('div',{});
      box.appendChild(closeMsg);
      const confirmCloseBtn = el('button',{class:'btn cta-yellow', style:'margin-top:8px;'},['Confirmar encerramento']);
      confirmCloseBtn.addEventListener('click', async ()=>{
        const buyerName = (otherInput.value.trim() || buyerInput.value || '').trim();
        closeMsg.innerHTML = '';
        if(!buyerName){
          closeMsg.appendChild(el('div',{class:'msg err'},['Informe quem foi o comprador.']));
          return;
        }
        const previousStatus = l.status;
        l.status = 'Encerrado';
        l.buyer = buyerName;
        l.closedAt = Date.now();
        const ok = await saveListings(l);
        if(!ok){
          l.status = previousStatus;
          l.buyer = null;
          l.closedAt = null;
          closeMsg.appendChild(el('div',{class:'msg err'},['Não foi possível salvar agora. Tente novamente.']));
          return;
        }
        render();
      });
      box.appendChild(confirmCloseBtn);
      modal.appendChild(box);
    }

    if(isSeller && l.status === 'Encerrado'){
      const box = el('div',{class:'fee-box'});
      box.appendChild(el('div',{},['Aguardando confirmação de ', el('b',{},[l.buyer]), '. Se for engano, você pode cancelar e reabrir o anúncio.']));
      const cancelBtn = el('button',{class:'btn ghost', style:'margin-top:8px;'},['Cancelar encerramento']);
      cancelBtn.addEventListener('click', async ()=>{
        l.status = 'Disponível';
        l.buyer = null;
        l.closedAt = null;
        await saveListings(l);
        render();
      });
      box.appendChild(cancelBtn);
      modal.appendChild(box);
    }

    if(isBuyer && l.status === 'Encerrado'){
      const box = el('div',{class:'fee-box'});
      box.appendChild(el('div',{style:'margin-bottom:10px;'},['Você recebeu esta criatura? Confirme e avalie o vendedor:']));
      const ratingInput = buildPokeballInput();
      const ratingRow = el('div',{style:'display:flex; justify-content:center; margin:12px 0;'},[ratingInput.container]);
      box.appendChild(ratingRow);
      const ratingComment = el('input',{type:'text', placeholder:'Comentário opcional', style:'margin-top:8px;'});
      box.appendChild(ratingComment);
      const rateMsg = el('div',{});
      box.appendChild(rateMsg);
      const confirmBtn = el('button',{class:'btn cta-yellow', style:'margin-top:8px;'},['Confirmar recebimento e avaliar']);
      confirmBtn.addEventListener('click', async ()=>{
        const stars = ratingInput.getValue();
        rateMsg.innerHTML = '';
        if(stars < 1){
          rateMsg.appendChild(el('div',{class:'msg err'},['Escolha de 1 a 5 pokébolas antes de confirmar.']));
          return;
        }
        l.status = 'Concluído';
        l.rating = { stars, comment: ratingComment.value.trim(), ratedAt: Date.now() };
        if(!state.users[l.seller] && sb){
          const { data: sellerProf } = await sb.from('profiles').select('*').eq('username', l.seller).single();
          if(sellerProf) state.users[l.seller] = profileRowToUser(sellerProf);
        }
        if(state.users[l.seller]){
          state.users[l.seller].ratingSum = (state.users[l.seller].ratingSum || 0) + stars;
          state.users[l.seller].ratingCount = (state.users[l.seller].ratingCount || 0) + 1;
        }
        const ok1 = await saveListings(l);
        const ok2 = await saveUsers(l.seller);
        if(!ok1 || !ok2){
          rateMsg.appendChild(el('div',{class:'msg err'},['Não foi possível registrar agora. Tente novamente.']));
          return;
        }
        render();
      });
      box.appendChild(confirmBtn);
      modal.appendChild(box);
    }

    if(l.status === 'Concluído'){
      const box = el('div',{class:'fee-box'});
      box.appendChild(el('div',{},[ 'Negociação concluída' + (l.buyer ? (' com ' + l.buyer) : '') + '.' ]));
      if(l.rating){
        const rr = el('div',{style:'margin-top:6px; display:flex; align-items:center; gap:8px;'});
        rr.appendChild(renderPokeballs(l.rating.stars, null));
        if(l.rating.comment) rr.appendChild(el('span',{class:'note'},['"' + l.rating.comment + '"']));
        box.appendChild(rr);
      } else {
        box.appendChild(el('div',{class:'note', style:'margin-top:4px;'},['Concluído automaticamente — o comprador não confirmou dentro do prazo.']));
      }
      modal.appendChild(box);
    }

    if(l.status === 'Expirado'){
      modal.appendChild(el('div',{class:'fee-box'},['Este anúncio expirou sem negociação.']));
    }

    modal.appendChild(el('h2',{class:'section-title', style:'margin-top:18px;'},['Ofertas & conversa']));
    const commentsWrap = el('div',{});
    if(l.comments.length === 0){
      commentsWrap.appendChild(el('div',{class:'note'},['Nenhuma mensagem ainda. Seja o primeiro a fazer uma oferta.']));
    } else {
      l.comments.forEach((c, idx)=>{
        const row = el('div',{class:'comment', style:'display:flex; justify-content:space-between; align-items:flex-start; gap:8px;'});
        row.appendChild(el('div',{},[
          el('b',{},[c.user]), c.offer ? el('span',{class:'val'},[' propõe R$ ' + Number(c.offer).toFixed(2) + ' — ']) : ' — ',
          c.text || '',
        ]));
        if(isAdmin(state.currentUser)){
          const delCommentBtn = el('button',{class:'btn danger', style:'padding:3px 7px; font-size:9px;'},['remover']);
          delCommentBtn.addEventListener('click', async ()=>{
            if(c.id) await deleteComment(c.id);
            l.comments.splice(idx,1);
            render();
          });
          row.appendChild(delCommentBtn);
        }
        commentsWrap.appendChild(row);
      });
    }
    modal.appendChild(commentsWrap);

    if(state.currentUser){
      const cText = el('input',{placeholder:'Escreva uma mensagem...'});
      const cOffer = el('input',{type:'number', placeholder:'Oferta em R$ (opcional)', style:'max-width:180px;'});
      const sendBtn = el('button',{class:'btn', style:'margin-top:10px;'},['Enviar']);
      sendBtn.addEventListener('click', async ()=>{
        if(!cText.value.trim() && !cOffer.value) return;
        const comment = { user: state.currentUser, text: cText.value.trim(), offer: cOffer.value ? Number(cOffer.value) : null, ts: Date.now() };
        l.comments.push(comment);
        const ok = await insertComment(l.id, comment);
        if(!ok){
          const idx = l.comments.indexOf(comment);
          if(idx >= 0) l.comments.splice(idx,1);
        }
        render();
      });
      modal.appendChild(el('div',{class:'field-row', style:'margin-top:12px;'},[cText, cOffer]));
      modal.appendChild(sendBtn);
    } else {
      modal.appendChild(el('div',{class:'note', style:'margin-top:10px;'},['Entre na sua conta para fazer uma oferta ou conversar com o vendedor.']));
    }

    bg.appendChild(modal);
    document.getElementById('pxroot').appendChild(bg);
  }

  // ---------- FOOTER ----------
  function renderFooter(){
    const grid = document.getElementById('footerGrid');
    if(!grid) return;
    grid.innerHTML = '';

    const brand = el('div',{class:'footer-col footer-brand'});
    brand.appendChild(el('div',{class:'logo-text px-font', style:'font-size:11px; margin-bottom:10px;'},['IDLE', el('b',{style:'color:var(--green);'},['PIX'])]));
    brand.appendChild(el('p',{},['A vitrine da comunidade pra comprar, vender e ofertar criaturas de jogos idle. Este é o marketplace do Pokepixel — a plataforma é intermediária: a negociação é sempre entre treinadores.']));
    brand.appendChild(el('div',{class:'payment-badges'},[
      el('span',{},['✓ Avaliação por pokébolas']),
      el('span',{},['✓ Negociação direta, sem intermediário no dinheiro']),
    ]));
    grid.appendChild(brand);

    const mercadoCol = el('div',{class:'footer-col'});
    mercadoCol.appendChild(el('h4',{},['Mercado']));
    mercadoCol.appendChild(el('button',{onclick:()=>setView('mercado')},['Explorar anúncios']));
    mercadoCol.appendChild(el('button',{onclick:()=>setView('anunciar')},['Anunciar Pokémon']));
    mercadoCol.appendChild(el('button',{onclick:()=>setView('home')},['Destaques']));
    grid.appendChild(mercadoCol);

    const contaCol = el('div',{class:'footer-col'});
    contaCol.appendChild(el('h4',{},['Conta']));
    contaCol.appendChild(el('button',{onclick:()=>setView('conta')},['Minha conta']));
    contaCol.appendChild(el('button',{onclick:()=>setView('conta')},['Minha coleção']));
    contaCol.appendChild(el('button',{onclick:()=>setView('termos')},['Termos de uso']));
    grid.appendChild(contaCol);

    const comCol = el('div',{class:'footer-col'});
    comCol.appendChild(el('h4',{},['Comunidade']));
    comCol.appendChild(el('a',{href:'https://discord.gg/pokepixel', target:'_blank', rel:'noopener noreferrer'},['Discord do PokePixel ↗']));
    grid.appendChild(comCol);
  }

  // ---------- RENDER ----------
  // Lista de jogos disponíveis na plataforma IDLEPIX — hoje só o Pokepixel; adicionar
  // novos jogos aqui no futuro é só incluir mais um item neste array.
  const GAMES = [
    { id:'pokepixel', label:'Pokepixel' },
  ];
  let gamePickerOpen = false;
  function renderGamePicker(){
    const wrap = document.getElementById('gamePicker');
    if(!wrap) return;
    wrap.innerHTML = '';
    const current = GAMES[0];

    const btn = el('div',{class:'game-picker-btn'},[
      el('span',{class:'sq'}),
      el('span',{},[current.label]),
      el('span',{class:'arrow'},[gamePickerOpen ? '▲' : '▼']),
    ]);
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      gamePickerOpen = !gamePickerOpen;
      renderGamePicker();
    });
    wrap.appendChild(btn);

    const dropdown = el('div',{class:'game-picker-dropdown' + (gamePickerOpen ? ' open' : '')});
    GAMES.forEach(g=>{
      const item = el('div',{class:'game-picker-item' + (g.id === current.id ? ' active' : '')},[
        el('span',{class:'sq'}),
        el('span',{},[g.label]),
      ]);
      item.addEventListener('click', (e)=>{
        e.stopPropagation();
        gamePickerOpen = false;
        setView('home');
      });
      dropdown.appendChild(item);
    });
    wrap.appendChild(dropdown);
  }
  document.addEventListener('click', ()=>{
    if(gamePickerOpen){ gamePickerOpen = false; renderGamePicker(); }
  });

  function render(){
    renderNav();
    renderFooter();
    renderGamePicker();
    const main = document.getElementById('main');
    main.innerHTML = '';
    const existingModal = document.querySelector('.modal-bg');
    if(existingModal) existingModal.remove();

    if(!state.loaded){
      main.appendChild(el('div',{class:'empty'},['Carregando dados do mercado...']));
      return;
    }

    if(state.view === 'home') renderHome(main);
    if(state.view === 'mercado') renderMercado(main);
    if(state.view === 'anunciar') renderAnunciar(main);
    if(state.view === 'editar') renderEditarAnuncio(main);
    if(state.view === 'apoiar') renderApoiar(main);
    if(state.view === 'conta') renderConta(main);
    if(state.view === 'termos') renderTermos(main);

    renderModal();
  }

  function checkAuthRedirect(){
    const hash = window.location.hash || '';
    if(hash.includes('access_token') || hash.includes('type=signup') || hash.includes('type=email_change') || hash.includes('type=recovery')){
      state.justConfirmedEmail = true;
      const cleanUrl = window.location.pathname + window.location.search;
      window.history.replaceState(null, '', cleanUrl);
    }
    if(hash.includes('error=')){
      state.authRedirectError = true;
      const cleanUrl = window.location.pathname + window.location.search;
      window.history.replaceState(null, '', cleanUrl);
    }
  }
  checkAuthRedirect();

  Promise.all([loadState(), loadPokedex()]).then(async ()=>{
    const changedListings = runListingLifecycle();
    if(changedListings.length > 0){
      const myId = state.users[state.currentUser] && state.users[state.currentUser].id;
      const amAdmin = isAdmin(state.currentUser);
      const persistable = amAdmin ? changedListings : changedListings.filter(l => l.sellerId === myId);
      if(persistable.length > 0) await saveListings(persistable);
    }
    render();
  });
})();
</script>
